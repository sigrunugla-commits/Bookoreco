<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>My Little Pony book quiz</title>
<style>

  *{

    box-sizing: border-box;

  }

  body {
    background-color: #e9f5db;
    margin: 0;
    height: 100vh;
  }

  h1 {
    display: flex;
    flex-direction: column; 
    align-items: center;
    color: #718355;
    font-family: "Bodoni MT";
    font-size: 40pt;
    font-weight: 100;  
  }

  h2 {
    display: flex;
    flex-direction: column; 
    align-items: right;
    color: #718355;
    font-family: "Bodoni MT";
    font-weight: 100;
    font-size: 25pt;
    margin-left: 40px;
    line-height: 0.5;

    text-align: center;
  }

  .questionblock, .question, .answers{
    position: relative;
    float: left;
    width: 100%;
  }

  .answer{
    position: relative;
    float: left;

    width: calc(100%/3);

    padding: 5px;

    display:flex;
    flex-direction: column; 
    align-items: center;

    color: #718355;
    font-family: "Bodoni MT";
    font-weight: 100;
    font-size: 20pt;
    line-height: 0.5;
  }

  .answer img{
    width: 60%;
  }

  .back-button {
    position: absolute;
    top: 10px;
    left: 10px;
    color:#e9f5db;
    padding: 8px 12px;
    background-color: #718355;
    border: none;
    border-radius: 4px;
    cursor: pointer;
  }
  .list-button {
    position: absolute;
    top: 10px;
    right: 10px;
    padding: 8px 12px;
    background-color: #718355;
    color:#e9f5db;
    border: none;
    border-radius: 4px;
    cursor: pointer;
  }
  
</style>

</head>
<body>

<nav>

  <button class="list-button" onclick="window.location='LISTI.html'">LIST</button>

</nav>
